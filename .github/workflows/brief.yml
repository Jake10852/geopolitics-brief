name: Daily Brief

on:
  schedule:
    # 06:00 UTC, every day including weekends.
    # GitHub cron is ALWAYS UTC and does not follow British Summer Time.
    # 06:00 UTC = 07:00 BST (late Mar - late Oct) and 06:00 GMT in winter.
    # GitHub also queues scheduled runs under load, so delivery usually lands
    # somewhere between 07:00 and 08:30 BST rather than exactly on the hour.
    - cron: "0 6 * * *"
  # Lets you trigger a test run by hand from the Actions tab.
  workflow_dispatch:
    inputs:
      force_date:
        description: "Override the date (YYYY-MM-DD) to preview another day's rotation. Leave blank for today."
        required: false
        default: ""
      dry_run:
        description: "Build the brief but do not send the email."
        type: boolean
        required: false
        default: false

# If a manual run overlaps the scheduled one, don't send two emails.
concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate and send brief
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          FORCE_DATE: ${{ github.event.inputs.force_date }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
        run: python brief.py

      - name: Save a copy of the rendered brief
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brief-html
          path: brief-output.html
          if-no-files-found: ignore
          retention-days: 14
