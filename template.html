<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Brief</title>
<style>
  body {
    margin: 0;
    padding: 0 0 40px;
    background: #fbfaf7;
    color: #1a1a1a;
    font-family: Georgia, "Times New Roman", serif;
    line-height: 1.62;
    font-size: 16px;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 28px 22px 0; }

  .masthead { border-bottom: 3px double #1a1a1a; padding-bottom: 12px; }
  .kicker {
    font-family: Helvetica, Arial, sans-serif;
    font-size: 10px; letter-spacing: .22em; text-transform: uppercase;
    color: #8a3324; font-weight: bold; margin: 0 0 6px;
  }
  h1 { font-size: 30px; line-height: 1.1; margin: 0 0 10px; }
  .dateline {
    font-family: Helvetica, Arial, sans-serif;
    font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: #6b6b6b;
  }
  .dateline span { display: inline-block; margin-right: 16px; }
  .dateline .region { color: #8a3324; font-weight: bold; }

  section { margin-top: 30px; }
  h2 {
    font-family: Helvetica, Arial, sans-serif;
    font-size: 11px; letter-spacing: .18em; text-transform: uppercase;
    color: #6b6b6b; font-weight: bold;
    margin: 0 0 4px; padding-bottom: 8px; border-bottom: 1px solid #d9d5cc;
  }
  h3 { font-size: 22px; line-height: 1.22; margin: 14px 0 12px; }
  h3 .era {
    display: block; font-family: Helvetica, Arial, sans-serif;
    font-size: 12px; letter-spacing: .1em; text-transform: uppercase;
    color: #8a3324; margin-top: 5px; font-weight: bold;
  }
  p { margin: 0 0 15px; }

  .echo { background: #f3f1ea; border-left: 3px solid #8a3324; padding: 20px 22px 8px; margin-top: 14px; }
  .echo h3 { margin-top: 0; }

  .takeaway { border-top: 1px solid #d9d5cc; border-bottom: 1px solid #d9d5cc; padding: 18px 0; margin-top: 14px; }
  .watch { margin: 12px 0 0; padding-left: 20px; }
  .watch li { margin-bottom: 7px; }

  ol.sources { font-family: Helvetica, Arial, sans-serif; font-size: 13px; color: #6b6b6b; padding-left: 20px; margin-top: 14px; }
  ol.sources li { margin-bottom: 9px; }
  ol.sources a { color: #8a3324; text-decoration: none; }
  .outlet { color: #6b6b6b; }

  /* --- Section divider, used between the three parts of the brief --- */
  .divider {
    margin: 46px 0 0;
    border-top: 3px double #1a1a1a;
    text-align: center;
    line-height: 0;
  }
  .divider span {
    display: inline-block;
    position: relative;
    top: -17px;
    background: #fbfaf7;
    padding: 0 18px;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 27px;
    letter-spacing: .01em;
    font-weight: bold;
    color: #8a3324;
    line-height: 34px;
  }
  /* The first divider sits just under the masthead rule, so it drops the
     border and simply acts as a large section title. */
  .divider.first {
    border-top: none;
    margin-top: 30px;
  }
  .divider.first span { top: 0; }

  /* --- Spanish section --- */
  .phrase {
    border-bottom: 1px solid #e6e2d9;
    padding: 16px 0 10px;
  }
  .phrase:last-child { border-bottom: none; }
  .phrase .es {
    font-size: 21px;
    color: #8a3324;
    margin: 0 0 4px;
    line-height: 1.3;
  }
  .phrase .lit {
    font-family: Helvetica, Arial, sans-serif;
    font-size: 13px;
    font-style: italic;
    color: #8c8577;
    margin: 0 0 8px;
  }
  .phrase .use { margin: 0 0 10px; font-size: 15px; }
  .phrase .tricky {
    margin: 0 0 10px;
    font-size: 15px;
    background: #f3f1ea;
    border-left: 3px solid #c9c2b2;
    padding: 10px 14px;
  }
  .phrase .example {
    margin: 0 0 10px;
    font-size: 15px;
    padding-left: 14px;
    border-left: 3px solid #8a3324;
  }
  .translation-inline {
    font-family: Helvetica, Arial, sans-serif;
    font-size: 13px;
    color: #6b6b6b;
  }
  .phrase .tags { margin: 0; }
  .tag {
    display: inline-block;
    font-family: Helvetica, Arial, sans-serif;
    font-size: 10px;
    letter-spacing: .1em;
    text-transform: uppercase;
    background: #ece8de;
    color: #6b6b6b;
    padding: 3px 9px;
    margin-right: 6px;
    border-radius: 2px;
  }
  .tag.region-tag { background: #8a3324; color: #fbfaf7; }
  .dialogue { font-size: 17px; line-height: 1.75; margin-bottom: 12px; }
  .translation {
    font-family: Helvetica, Arial, sans-serif;
    font-size: 13px;
    color: #6b6b6b;
    border-top: 1px solid #ddd8cc;
    padding-top: 12px;
  }

  /* --- General knowledge section --- */
  .fact {
    border-bottom: 1px solid #e6e2d9;
    padding: 16px 0 12px;
  }
  .fact:last-child { border-bottom: none; }
  .fact .hook {
    font-size: 18px;
    line-height: 1.35;
    font-weight: bold;
    margin: 0 0 7px;
  }
  .fact .context {
    margin: 0 0 9px;
    font-size: 15px;
    color: #3a3a3a;
  }
  .fact .tags { margin: 0; }

  .footer {
    margin-top: 32px; padding-top: 14px; border-top: 1px solid #d9d5cc;
    font-family: Helvetica, Arial, sans-serif; font-size: 12px; color: #6b6b6b; line-height: 1.5;
  }
</style>
</head>
<body>
  <div class="wrap">

    <div class="masthead">
      <p class="kicker"><!--KICKER--></p>
      <h1><!--TITLE--></h1>
    </div>

    <!--CONTENT-->

    <div class="footer">
      Generated automatically every morning: geopolitics, Spanish practice and general knowledge in one brief.
      The geopolitics section draws on live web sources — worth a click before you rely on anything in it.
    </div>

  </div>
</body>
</html>
